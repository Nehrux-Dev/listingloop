name: CI

# Runs the backend test suite and the frontend type-check on every push and
# pull request. This exists because the suite cannot be run on a typical dev
# machine (it needs Python 3.12, PyMuPDF and a Postgres, matching the backend
# image) — so without this, tests were only ever "written", never "run".
on:
  push:
  pull_request:

# One run per branch; a new push cancels the previous, still-running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # The test settings (config.settings, TESTING branch) already swap Redis
    # for a local-memory cache and run Celery inline, so the only service the
    # suite needs is a database. The credentials match settings.py's Postgres
    # defaults, so no DATABASE_URL is required.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: real_estate
          POSTGRES_USER: real_estate
          POSTGRES_PASSWORD: real_estate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U real_estate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-insecure-key-not-used-for-anything-real-000000
      DJANGO_DEBUG: "False"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        # A model change without its migration passes tests locally and breaks
        # the first deploy. Catch it here instead.
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
