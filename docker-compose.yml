# Local development stack: Postgres + Redis + Django + Celery worker + Vite.
#
#   cp .env.example .env && docker compose up --build
#
# Values come from the root .env file (see .env.example). The `${VAR:-default}`
# form keeps the stack bootable even if a variable is missing.

name: real-estate

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-real_estate}
      POSTGRES_USER: ${POSTGRES_USER:-real_estate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-real_estate}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-real_estate} -d ${POSTGRES_DB:-real_estate}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    # Named explicitly and shared with celery_worker: both are built from the
    # same context, and giving them separate images lets one silently run
    # stale code after a dependency change.
    image: real-estate-backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      # Override the host-oriented values from .env with compose service names.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgres://${POSTGRES_USER:-real_estate}:${POSTGRES_PASSWORD:-real_estate}@db:5432/${POSTGRES_DB:-real_estate}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      RENDERER_URL: http://renderer:8080
      RENDERER_TOKEN: ${RENDERER_TOKEN:-dev-renderer-token-change-me}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      renderer:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # HTML -> image. Renders arbitrary HTML, so it is deliberately NOT published
  # to the host: only other compose services can reach it. See renderer/.
  renderer:
    build:
      context: ./renderer
    restart: unless-stopped
    environment:
      RENDERER_TOKEN: ${RENDERER_TOKEN:-dev-renderer-token-change-me}
      RENDERER_PAGES_PER_VIEWPORT: ${RENDERER_PAGES_PER_VIEWPORT:-2}
    expose:
      - "8080"
    # Chromium peaks around 700 MB per the Step 4 prototype; the cap keeps a
    # runaway render from taking the rest of the stack down with it.
    mem_limit: ${RENDERER_MEM_LIMIT:-1500m}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  celery_worker:
    build:
      context: ./backend
    image: real-estate-backend
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgres://${POSTGRES_USER:-real_estate}:${POSTGRES_PASSWORD:-real_estate}@db:5432/${POSTGRES_DB:-real_estate}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:8000}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # Keep the image's node_modules; don't let the bind mount hide them.
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
